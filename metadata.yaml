#   report/front-matter/cover.md  y  report/03-table-of-contents.md
# Por eso se desactivan la portada y el TOC automáticos de Eisvogel.
titlepage: false
toc: false

bibliography: bibtex.bib
link-citations: true
nocite: '@*'            # lista todas las entradas de bibtex.bib aunque aún no se citen
block-headings: true    # \paragraph (nivel 4-5) como título en bloque, no en línea
colorlinks: true

